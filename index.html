<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" />
    <title>CE Internship Dashboard</title>
    <script>
      // ตั้งธีมก่อนวาดหน้า เพื่อไม่ให้จอขาวกะพริบ · ค่าเริ่มต้นเป็นธีมมืด
      try {
        var savedTheme = localStorage.getItem('ce-theme')
        document.documentElement.dataset.theme = savedTheme === 'light' ? 'light' : 'dark'
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
